# Esqueleto. En la guia 02 lo completas hasta tener los cuatro servicios.
#
# Ya esta el primero, la base de datos, para que veas la forma. Te faltan tres:
#   2. laravel   construye con docker/laravel.Dockerfile, publica el 8081, habla con db
#   3. django    construye con docker/django.Dockerfile, publica el 8082, habla con db
#   4. angular   construye con docker/angular.Dockerfile, publica el 8080
#
# Reglas que se repiten en los tres:
#   - ninguno lleva la contrasena escrita aqui: sale de tu .env
#   - todos van en la misma red `interna`, si no, no se ven entre ellos
#   - el que necesita la base espera a que este sana con depends_on + condition

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${BD_LARAVEL:?falta BD_LARAVEL en tu .env}
      POSTGRES_USER: ${BD_USUARIO:?falta BD_USUARIO en tu .env}
      POSTGRES_PASSWORD: ${BD_CLAVE:?falta BD_CLAVE en tu .env}
    volumes:
      # 1. Donde viven los datos. Sobrevive a `down`, muere con `down -v`
      - datos-db:/var/lib/postgresql/data
      # 2. Crea la segunda base la primera vez que nace el volumen
      - ./docker/postgres/crear-bases.sql:/docker-entrypoint-initdb.d/crear-bases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [interna]

  laravel:
    build:
      context: .
      dockerfile: docker/laravel.Dockerfile
    environment:
      APP_NAME: Avisos
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY:?falta APP_KEY en tu .env, generala con php artisan key:generate}
      APP_URL: ${URL_LARAVEL:-http://localhost:8081}
      LOG_CHANNEL: stderr
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: "5432"
      DB_DATABASE: ${BD_LARAVEL}
      DB_USERNAME: ${BD_USUARIO}
      DB_PASSWORD: ${BD_CLAVE}
      SESSION_DRIVER: file
      CACHE_STORE: file
    ports: ["${PUERTO_LARAVEL:-8081}:80"]
    depends_on:
      db: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "php -r 'exit(@file_get_contents(\"http://127.0.0.1/up\") === false ? 1 : 0);'"]
      interval: 10s
      timeout: 5s
      retries: 12
    volumes:
      - almacen-laravel:/var/www/html/storage
    networks: [interna]

  django:
    build:
      context: .
      dockerfile: docker/django.Dockerfile
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?falta DJANGO_SECRET_KEY en tu .env}
      DJANGO_DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,django}
      DJANGO_DB_NAME: ${BD_DJANGO:-avisos_django}
      DJANGO_DB_USER: ${BD_USUARIO}
      DJANGO_DB_PASSWORD: ${BD_CLAVE}
      DJANGO_DB_HOST: db
      DJANGO_DB_PORT: "5432"
    ports: ["${PUERTO_DJANGO:-8082}:8000"]
    depends_on:
      db: {condition: service_healthy}
    networks: [interna]

  angular:
    build:
      context: .
      dockerfile: docker/angular.Dockerfile
    ports: ["${PUERTO_ANGULAR:-8080}:80"]
    depends_on: [laravel, django]
    networks: [interna]

networks:
  interna:

volumes:
  datos-db:
  almacen-laravel:
